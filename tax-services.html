<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tax Advisory & Mentorship Portal</title>
    <style>
        :root {
            --primary-color: #2563eb;
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-color: #f8fafc;
            --text-muted: #94a3b8;
            --border-color: #334155;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            box-sizing: border-box;
        }

        .container {
            width: 100%;
            max-width: 500px;
            background: var(--card-bg);
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.4);
            border: 1px solid var(--border-color);
        }

        /* Services Tabs - Stacked as a column on mobile */
        .services-tabs {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-bottom: 25px;
        }

        .service-tab {
            background-color: rgba(59, 130, 246, 0.1);
            border: 1px solid var(--border-color);
            padding: 12px 15px;
            border-radius: 8px;
            text-align: center;
            font-size: 0.95rem;
            font-weight: 600;
            color: var(--text-color);
        }

        h2 {
            margin-top: 0;
            margin-bottom: 20px;
            text-align: center;
            font-size: 1.5rem;
        }

        .form-group {
            margin-bottom: 15px;
        }

        label {
            display: block;
            margin-bottom: 5px;
            font-weight: 500;
            font-size: 0.9rem;
        }

        input, select, textarea {
            width: 100%;
            padding: 10px 12px;
            background-color: var(--bg-color);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            color: var(--text-color);
            font-size: 1rem;
            box-sizing: border-box;
        }

        input:focus, select:focus, textarea:focus {
            outline: none;
            border-color: var(--primary-color);
        }

        .hidden-fields {
            display: none;
        }

        button {
            width: 100%;
            padding: 12px;
            background-color: var(--primary-color);
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
            transition: background 0.2s;
        }

        button:hover {
            background-color: #1d4ed8;
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>Tax Advisory & Services</h2>

        <!-- Services list stacked in a column on mobile -->
        <div class="services-tabs">
            <div class="service-tab">Mentorship Program</div>
            <div class="service-tab">Income Tax & Advisory</div>
            <div class="service-tab">Corporate Tax & Bookkeeping</div>
        </div>

        <form id="tax-form">
            <div class="form-group">
                <label for="full_name">Full Name *</label>
                <input type="text" id="full_name" required placeholder="Enter your full name">
            </div>

            <div class="form-group">
                <label for="email">Email Address *</label>
                <input type="email" id="email" required placeholder="name@example.com">
            </div>

            <div class="form-group">
                <label for="phone">Phone Number *</label>
                <input type="tel" id="phone" required placeholder="(555) 000-0000">
            </div>

            <div class="form-group">
                <label for="services_needed">Services Needed *</label>
                <select id="services_needed" required onchange="toggleFollowUps()">
                    <option value="">Select a service...</option>
                    <option value="Mentorship">Mentorship Program</option>
                    <option value="Personal Tax">Personal Tax Return</option>
                    <option value="Corporate Tax">Corporate Tax & Advisory</option>
                    <option value="Bookkeeping">Bookkeeping & Payroll</option>
                </select>
            </div>

            <!-- Follow-up fields hidden until service is selected -->
            <div id="follow-up-fields" class="hidden-fields">
                <div class="form-group">
                    <label for="tax_years">Tax Years Needed</label>
                    <input type="text" id="tax_years" placeholder="e.g., 2024, 2025">
                </div>

                <div class="form-group">
                    <label for="sin">Social Insurance Number (SIN)</label>
                    <input type="password" id="sin" placeholder="Optional / Secure entry">
                </div>

                <div class="form-group">
                    <label for="dob">Date of Birth</label>
                    <input type="date" id="dob">
                </div>

                <div class="form-group">
                    <label for="marital_status">Marital Status</label>
                    <select id="marital_status">
                        <option value="">Select status...</option>
                        <option value="Single">Single</option>
                        <option value="Married">Married</option>
                        <option value="Common-law">Common-law</option>
                        <option value="Divorced">Divorced / Separated</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="address">Address</label>
                    <input type="text" id="address" placeholder="Your address">
                </div>

                <div class="form-group">
                    <label for="document">Upload Supporting Documents</label>
                    <input type="file" id="document">
                </div>

                <div class="form-group">
                    <label for="message">Additional Details / Message</label>
                    <textarea id="message" rows="3" placeholder="Any extra details..."></textarea>
                </div>
            </div>

            <button type="submit">Submit Inquiry</button>
        </form>
    </div>

    <script>
        function toggleFollowUps() {
            const serviceSelect = document.getElementById('services_needed');
            const followUpFields = document.getElementById('follow-up-fields');
            
            if (serviceSelect.value !== "") {
                followUpFields.style.display = "block";
            } else {
                followUpFields.style.display = "none";
            }
        }
    </script>
</body>
</html>
